<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphify — Architecture & Knowledge Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-glass: rgba(30, 41, 59, 0.6);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cyan-accent: #38bdf8;
      --purple-accent: #c084fc;
      --emerald-accent: #34d399;
      --amber-accent: #fbbf24;
      --rose-accent: #f43f5e;
      --indigo-accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Background Ambient Grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.1) 0%, transparent 40%),
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* App Container */
    #app-layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Glass Header */
    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--cyan-accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }

    /* Navigation Tabs */
    .view-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 8px 14px 8px 36px;
      color: #fff;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      width: 280px;
      border-color: var(--cyan-accent);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .action-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-glass);
      background: rgba(30, 41, 59, 0.5);
      color: var(--text-main);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Sub-bar / Legend */
    .sub-bar {
      padding: 8px 24px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .legend-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 6px currentColor;
    }

    /* Main Content Workspace */
    #workspace {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .view-panel {
      position: absolute;
      inset: 0;
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    /* Vis Network Canvas */
    #network-container {
      width: 100%;
      height: 100%;
    }

    /* D3 Tree View Canvas */
    #tree-view-container {
      width: 100%;
      height: 100%;
      overflow: auto;
    }

    svg.d3-chart {
      width: 100%;
      height: 100%;
      min-width: 3000px;
      min-height: 2500px;
    }

    .node circle {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .node text {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      fill: #e2e8f0;
      paint-order: stroke fill;
      stroke: #090d16;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .link {
      fill: none;
      stroke: rgba(148, 163, 184, 0.25);
      stroke-width: 1.5px;
    }

    /* Floating Detail Drawer */
    .drawer {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 360px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
      padding: 24px;
      z-index: 10;
      transform: translateX(400px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 16px;
    }

    .drawer-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      word-break: break-all;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .meta-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .meta-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--cyan-accent);
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      word-break: break-all;
    }

    .children-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .child-item {
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .child-item:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: rgba(56, 189, 248, 0.3);
      color: #fff;
    }
  </style>
</head>

    <!-- Workspace -->

        </div>
      </div>
    </div>

    function getColorForName(name, parentName = '') {
      const n = name.toLowerCase();
      const p = parentName.toLowerCase();

      if (n.includes('controller')) return { background: '#c084fc', border: '#a855f7', highlight: { background: '#e9d5ff', border: '#c084fc' } };
      if (n.includes('service')) return { background: '#818cf8', border: '#6366f1', highlight: { background: '#c7d2fe', border: '#818cf8' } };
      if (n.includes('dto')) return { background: '#f43f5e', border: '#e11d48', highlight: { background: '#fecdd3', border: '#f43f5e' } };
      if (n.includes('prisma') || n.includes('schema') || n.includes('seed')) return { background: '#fbbf24', border: '#d97706', highlight: { background: '#fef3c7', border: '#fbbf24' } };
      if (p.includes('backend') || n.includes('backend') || n.includes('nest')) return { background: '#38bdf8', border: '#0284c7', highlight: { background: '#bae6fd', border: '#38bdf8' } };
      if (p.includes('frontend') || n.includes('frontend') || n.includes('page') || n.includes('component')) return { background: '#34d399', border: '#059669', highlight: { background: '#a7f3d0', border: '#34d399' } };
      return { background: '#64748b', border: '#475569', highlight: { background: '#cbd5e1', border: '#64748b' } };
    }

    function processTreeData(root) {
      const nodesMap = new Map();
      const edgesArr = [];
      let idCounter = 1;

      function traverse(curr, parentId = null, path = '') {
        const myId = idCounter++;
        const currentPath = path ? path + '/' + curr.name : curr.name;
        const color = getColorForName(curr.name, path);
        const count = curr.total_count || 1;
        const size = Math.min(45, Math.max(12, Math.log2(count + 1) * 8));

        nodesMap.set(myId, {
          id: myId,
          label: curr.name,
          title: curr.name + ' (' + count + ' elementos)',
          value: count,
          size: size,
          color: color,
          font: { color: '#f8fafc', face: 'Inter', size: 12, strokeWidth: 3, strokeColor: '#090d16' },
          borderWidth: 2,
          shadow: { enabled: true, color: color.background, size: 8, x: 0, y: 0 },
          rawData: curr,
          path: currentPath
        });

        if (parentId !== null) {
          edgesArr.push({
            from: parentId,
            to: myId,
            color: { color: 'rgba(148, 163, 184, 0.25)', highlight: '#38bdf8', hover: '#38bdf8' },
            width: 1.5,
            smooth: { type: 'continuous' }
          });
        }

        if (curr.children && curr.children.length > 0) {
          curr.children.forEach(child => traverse(child, myId, currentPath));
        }
      }

      traverse(root);
      return { nodes: Array.from(nodesMap.values()), edges: edgesArr };
    }

      const container = document.getElementById('network-container');
      const data = processTreeData(initialJsonData);
      
      const options = {

          stabilization: { iterations: 150 }
        },
        interaction: { hover: true, tooltipDelay: 100, zoomView: true, dragView: true }
      };

      network = new vis.Network(container, { nodes: new vis.DataSet(data.nodes), edges: new vis.DataSet(data.edges) }, options);
      visNodes = data.nodes;
      visEdges = data.edges;

      network.on("click", function (params) {
        if (params.nodes.length > 0) {
          const nodeObj = visNodes.find(n => n.id === params.nodes[0]);
          if (nodeObj) openDrawer(nodeObj);
        }
      });
    }

    function switchView(viewName, evt) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));

      if (evt) evt.currentTarget.classList.add('active');
      document.getElementById('view-' + viewName).classList.add('active');

      if (viewName === 'radial') renderRadialTree();
      else if (viewName === 'tree') renderD3Tree();
      else if (viewName === 'arch') renderArchGraph();
    }

    function openDrawer(nodeObj) {
      const drawer = document.getElementById('node-drawer');
      const title = document.getElementById('drawer-title');
      const type = document.getElementById('drawer-type');
      const path = document.getElementById('drawer-path');
      const count = document.getElementById('drawer-count');
      const childrenContainer = document.getElementById('drawer-children');

      title.innerText = nodeObj.label;
      path.innerText = nodeObj.path || nodeObj.label;
      count.innerText = nodeObj.value || (nodeObj.rawData ? nodeObj.rawData.total_count : 1) || 1;
      type.innerText = nodeObj.label.includes('.ts') ? 'Archivo TS' : (nodeObj.label.includes('.') ? 'Archivo' : 'Módulo');
      
      childrenContainer.innerHTML = '';
      const children = (nodeObj.rawData && nodeObj.rawData.children) ? nodeObj.rawData.children : [];
      
      if (children.length === 0) {
        childrenContainer.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding:8px;">No hay sub-elementos</div>';
      } else {
        children.forEach(child => {
          const item = document.createElement('div');
          item.className = 'child-item';
          item.innerHTML = '<span>' + child.name + '</span><span style="color:var(--cyan-accent); font-weight:600;">' + (child.total_count || 1) + '</span>';
          childrenContainer.appendChild(item);
        });
      }

      drawer.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('node-drawer').classList.remove('open');

    function handleSearch(query) {
      if (!query.trim()) return;
      const q = query.toLowerCase();
      const match = visNodes.find(n => n.label.toLowerCase().includes(q));
      if (match && network) {
        network.focus(match.id, { scale: 1.2, animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
        openDrawer(match);
      }

    function renderRadialTree() {
      const container = document.getElementById('radial-container');
      container.innerHTML = '';

      const width = container.clientWidth || 1200;
      const height = container.clientHeight || 800;
      const radius = Math.min(width, height) / 2 - 80;

      const tree = d3.tree()
        .size([2 * Math.PI, radius])
        .separation((a, b) => (a.parent == b.parent ? 1 : 2) / a.depth);

      const root = d3.hierarchy(initialJsonData);
      tree(root);

      const svg = d3.select(container).append("svg")
        .attr("width", width)
        .attr("height", height)
        .append("g")
        .attr("transform", 'translate(' + (width / 2) + ',' + (height / 2) + ')');

      svg.append("g")
        .selectAll("path")
        .data(root.links())
        .join("path")
        .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y))
        .attr("fill", "none")
        .attr("stroke", "rgba(56, 189, 248, 0.25)")
        .attr("stroke-width", 1.5);

      const node = svg.append("g")
        .selectAll("g")
        .data(root.descendants())
        .join("g")
        .attr("transform", d => 'rotate(' + (d.x * 180 / Math.PI - 90) + ') translate(' + d.y + ',0)');

      node.append("circle")
        .attr("r", d => Math.max(3, Math.min(10, Math.log2(d.data.total_count || 1) * 2)))
        .attr("fill", d => d.children ? "#38bdf8" : "#34d399")
        .attr("stroke", "#090d16")
        .attr("stroke-width", 1.5);

      node.append("text")
        .attr("dy", "0.31em")
        .attr("x", d => d.x < Math.PI === !d.children ? 6 : -6)
        .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
        .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
        .text(d => d.data.name)
        .attr("fill", "#e2e8f0")
        .attr("font-size", "10px")
        .attr("font-family", "Inter");
    }

    function renderD3Tree() {
      const svg = d3.select("#tree-svg");
      svg.selectAll("*").remove();

      const root = d3.hierarchy(initialJsonData);
      const treeLayout = d3.tree().size([3500, 1600]);
      treeLayout(root);

      const g = svg.append("g").attr("transform", "translate(100, 40)");

      g.selectAll(".link")

        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

      const node = g.selectAll(".node")

        .enter()

        .text(d => d.data.name);
