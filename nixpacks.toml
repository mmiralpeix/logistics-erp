[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.install]
cmds = ["cd frontend && npm install", "cd backend && npm install"]

[phases.build]
cmds = ["cd frontend && npm run build", "cd backend && npm run build"]

[start]
cmd = "cd backend && npx prisma db push --accept-data-loss && node dist/src/main.js"
